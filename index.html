<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>三海會</title>

<style>
:root{
  --navy:#173b61;
  --navy2:#0f2f4d;
  --cream:#fff4d4;
  --cream2:#f7e4b5;
  --sky:#8ed5ef;
  --sea:#258fc8;
  --red:#df5f4f;
  --ink:#173b61;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  background:#0f5f91;
  font-family:Arial,"Malgun Gothic",sans-serif;
  color:var(--ink);
}

button{
  font:inherit;
}

body{
  display:flex;
  justify-content:center;
}

#app{
  width:100%;
  max-width:520px;
  min-height:100dvh;
  background:#8ed5ef;
  overflow:hidden;
  position:relative;
}

/* =========================
   1. TITLE SCREEN
========================= */

#title-screen{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:640px;

  background-image:url("assets/title-bg.png");
  background-size:cover;
  background-position:center top;
  background-repeat:no-repeat;

  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* 첫 접속 때만 보이는 문구 */
#touch-text{
  position:absolute;

  left:50%;
  top:63%;

  transform:translate(-50%,-50%);

  width:100%;

  text-align:center;

  color:#fff5d8;

  font-size:clamp(19px,5.4vw,26px);
  font-weight:900;
  letter-spacing:.02em;

  text-shadow:
    2px 0 var(--navy2),
    -2px 0 var(--navy2),
    0 2px var(--navy2),
    0 -2px var(--navy2),
    2px 2px var(--navy2);

  animation:blink 1.05s steps(2,end) infinite;
}

@keyframes blink{
  50%{ opacity:.30; }
}


/* =========================
   2. TITLE MENU
========================= */

#title-menu{
  display:none;

  position:absolute;
  left:50%;
  top:66%;

  transform:translate(-50%,-50%);

  width:82%;
  max-width:360px;

  padding:12px 16px;

  background:rgba(255,244,212,.97);

  border:4px solid var(--navy);

  box-shadow:
    0 0 0 4px rgba(255,244,212,.72),
    0 8px 0 rgba(15,47,77,.18);
}

#title-menu.show{
  display:block;
  animation:menuIn .18s ease-out;
}

@keyframes menuIn{
  from{
    opacity:0;
    transform:translate(-50%,-46%);
  }
  to{
    opacity:1;
    transform:translate(-50%,-50%);
  }
}

.menu-button{
  display:block;

  width:100%;

  border:0;
  border-bottom:2px dashed #cbbd9d;

  background:transparent;

  padding:15px 10px;

  color:var(--navy);

  font-size:20px;
  font-weight:900;

  text-align:left;

  cursor:pointer;
}

.menu-button:last-child{
  border-bottom:0;
}

.menu-button::before{
  content:"▶";
  display:inline-block;
  width:34px;

  color:var(--red);
  opacity:0;
}

.menu-button:hover::before,
.menu-button:focus::before,
.menu-button:active::before{
  opacity:1;
}


/* =========================
   3. MAP GAME SCREEN
========================= */

#map-screen{
  display:none;

  min-height:100dvh;

  padding:
    calc(14px + env(safe-area-inset-top))
    12px
    calc(22px + env(safe-area-inset-bottom));

  background:
    linear-gradient(
      #aee5f3 0%,
      #dff3ed 48%,
      #fff0c8 100%
    );
}

#map-screen.show{
  display:block;
}

.map-header{
  text-align:center;
  margin-bottom:10px;
}

.map-header h1{
  font-family:Georgia,"Times New Roman",serif;
  font-size:32px;
  color:var(--navy);
}

.map-header p{
  margin-top:4px;
  font-size:13px;
  color:#4f6a76;
}

/* 지도 */
.map-wrap{
  position:relative;

  width:100%;
  max-width:500px;

  margin:0 auto;

  border:3px solid var(--navy);
  background:#87d0e4;

  overflow:hidden;
}

.map-image{
  display:block;

  width:100%;
  height:auto;

  image-rendering:pixelated;
}

/* 도시 라벨 */
.city{
  position:absolute;
  z-index:10;

  transform:translate(-50%,-50%);

  display:flex;
  align-items:center;
  gap:5px;

  pointer-events:none;
}

.city-dot{
  width:13px;
  height:13px;

  border-radius:50%;

  background:#e74d40;

  border:3px solid #fff3cf;

  box-shadow:0 0 0 2px var(--navy);
}

.city-name{
  color:#fff7d7;

  font-size:16px;
  font-weight:900;

  text-shadow:
    2px 0 var(--navy),
    -2px 0 var(--navy),
    0 2px var(--navy),
    0 -2px var(--navy),
    2px 2px var(--navy);
}

/*
  좌표는 %라서 모바일 크기가 바뀌어도
  지도 이미지에 붙어서 움직임.
*/

#city-incheon{
  left:28%;
  top:23%;
}

#city-yangyang{
  left:71%;
  top:14%;
}

#city-busan{
  left:74%;
  top:65%;
}


/* 드래그 판정용 영역 */
.target{
  position:absolute;

  z-index:9;

  transform:translate(-50%,-50%);

  width:17%;
  aspect-ratio:1;

  border:3px dashed rgba(255,255,255,.95);
  border-radius:50%;

  background:rgba(255,217,90,.16);

  opacity:0;

  pointer-events:none;
}

.map-wrap.dragging .target{
  opacity:.85;
  animation:targetBlink .65s steps(2,end) infinite;
}

@keyframes targetBlink{
  50%{opacity:.28}
}

#target-incheon{
  left:28%;
  top:23%;
}

#target-yangyang{
  left:71%;
  top:14%;
}

#target-busan{
  left:74%;
  top:65%;
}


/* 상태창 */
#status{
  width:100%;
  max-width:500px;

  margin:10px auto 8px;

  padding:11px 13px;

  border:3px solid var(--navy);

  background:#fff6d9;

  font-size:13px;
  line-height:1.55;
}


/* 아이템 */
.inventory-title{
  width:100%;
  max-width:500px;

  margin:10px auto 5px;

  font-size:12px;
  font-weight:900;

  color:var(--navy);
}

.inventory{
  width:100%;
  max-width:500px;

  margin:0 auto;

  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.item{
  min-height:116px;

  border:3px solid #718b89;

  background:#fff6d9;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:5px;

  padding:7px 4px;

  cursor:grab;

  user-select:none;
  touch-action:none;
}

.item:active{
  cursor:grabbing;
}

.item.done{
  opacity:.32;
  pointer-events:none;
}

.item img{
  width:72px;
  height:72px;

  object-fit:contain;

  image-rendering:pixelated;

  pointer-events:none;
}

.item span{
  font-size:10px;
  font-weight:900;

  text-align:center;
}


/* 드래그 중 따라다니는 이미지 */
.drag-ghost{
  position:fixed;

  z-index:9999;

  width:96px;
  height:96px;

  transform:translate(-50%,-50%);

  pointer-events:none;
}

.drag-ghost img{
  width:100%;
  height:100%;

  object-fit:contain;

  image-rendering:pixelated;
}


/* 성공 후 지도에 남는 아이템 */
.map-item{
  position:absolute;

  z-index:12;

  width:14%;

  transform:translate(-50%,-50%);

  image-rendering:pixelated;

  pointer-events:none;
}


/* 하단 버튼 */
.map-buttons{
  width:100%;
  max-width:500px;

  margin:12px auto 0;

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.map-button{
  border:0;

  padding:11px;

  background:var(--navy);

  color:white;

  font-weight:900;

  cursor:pointer;
}


/* =========================
   OPTION MODAL
========================= */

.modal{
  display:none;

  position:fixed;
  inset:0;

  z-index:10000;

  padding:20px;

  background:rgba(10,44,70,.45);

  align-items:center;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:360px;

  padding:18px;

  background:#fff5d7;

  border:4px solid var(--navy);
}

.modal-box h2{
  margin-bottom:12px;

  color:var(--navy);

  font-size:20px;
}

.option-row{
  display:flex;

  justify-content:space-between;
  align-items:center;

  padding:10px 0;

  border-bottom:1px dashed #c5b78f;

  font-size:13px;
}

.option-button{
  border:2px solid var(--navy);

  background:#f3e2ad;

  color:var(--navy);

  padding:7px 10px;

  font-weight:900;
}

.modal-close{
  margin-top:14px;

  width:100%;

  border:0;

  background:var(--navy);

  color:white;

  padding:10px;

  font-weight:900;
}

@media(min-width:521px){
  #app{
    box-shadow:0 0 35px rgba(0,0,0,.22);
  }
}
</style>
</head>


<body>

<div id="app">

  <!-- =====================
       TITLE
  ====================== -->

  <section id="title-screen">

    <div id="touch-text">
      - 화면을 터치하세요 -
    </div>

    <nav id="title-menu">

      <button class="menu-button" id="new-game">
        새 게임
      </button>

      <button class="menu-button" id="load-game">
        불러오기
      </button>

      <button class="menu-button" id="open-options">
        옵션
      </button>

    </nav>

  </section>


  <!-- =====================
       MAP
  ====================== -->

  <section id="map-screen">

    <header class="map-header">

      <h1>三海會</h1>

      <p>
        주인을 잃은 물건이 세 개.
        제자리로 돌려놓자.
      </p>

    </header>


    <div class="map-wrap" id="map-wrap">

      <img
        src="assets/korea-map.png"
        class="map-image"
        alt="대한민국 픽셀 지도"
      >


      <!-- 정답 영역 -->

      <div
        class="target"
        id="target-incheon">
      </div>

      <div
        class="target"
        id="target-yangyang">
      </div>

      <div
        class="target"
        id="target-busan">
      </div>


      <!-- 도시 표시 -->

      <div
        class="city"
        id="city-incheon">

        <span class="city-dot"></span>

        <span class="city-name">
          인천
        </span>

      </div>


      <div
        class="city"
        id="city-yangyang">

        <span class="city-dot"></span>

        <span class="city-name">
          양양
        </span>

      </div>


      <div
        class="city"
        id="city-busan">

        <span class="city-dot"></span>

        <span class="city-name">
          부산
        </span>

      </div>

    </div>


    <div id="status">
      이런 걸 흘리고 다니는 놈들이 누구지.
    </div>


    <div class="inventory-title">
      ITEMS
    </div>


    <section class="inventory">

      <div
        class="item"
        data-key="busan"
        data-target="target-busan"
        data-src="assets/spicy-shrimp.png">

        <img
          src="assets/spicy-shrimp.png"
          alt="매운 새우깡"
        >

        <span>
          매운 새우깡
        </span>

      </div>


      <div
        class="item"
        data-key="incheon"
        data-target="target-incheon"
        data-src="assets/sunglasses.png">

        <img
          src="assets/sunglasses.png"
          alt="선글라스"
        >

        <span>
          선글라스
        </span>

      </div>


      <div
        class="item"
        data-key="yangyang"
        data-target="target-yangyang"
        data-src="assets/hawaiian-shirt.png">

        <img
          src="assets/hawaiian-shirt.png"
          alt="하와이안 셔츠"
        >

        <span>
          하와이안 셔츠
        </span>

      </div>

    </section>


    <div class="map-buttons">

      <button
        class="map-button"
        id="back-title">
        타이틀로
      </button>

      <button
        class="map-button"
        id="reset-progress">
        처음부터
      </button>

    </div>

  </section>

</div>


<!-- =====================
     OPTIONS
====================== -->

<div
  class="modal"
  id="options-modal">

  <div class="modal-box">

    <h2>
      옵션
    </h2>


    <div class="option-row">

      <span>
        효과음
      </span>

      <button
        class="option-button"
        id="sound-toggle">
        ON
      </button>

    </div>


    <div class="option-row">

      <span>
        진행 기록
      </span>

      <button
        class="option-button"
        id="clear-save">
        초기화
      </button>

    </div>


    <button
      class="modal-close"
      id="close-options">
      닫기
    </button>

  </div>

</div>


<script>

const titleScreen =
  document.getElementById("title-screen");

const touchText =
  document.getElementById("touch-text");

const titleMenu =
  document.getElementById("title-menu");

const mapScreen =
  document.getElementById("map-screen");

const mapWrap =
  document.getElementById("map-wrap");

const statusBox =
  document.getElementById("status");

const optionsModal =
  document.getElementById("options-modal");


let titleOpened = false;


/* =========================
   SAVE DATA
========================= */

function readSave(){

  try{

    return new Set(
      JSON.parse(
        localStorage.getItem(
          "samhaehoe-progress"
        ) || "[]"
      )
    );

  }

  catch{

    return new Set();

  }

}


let solved =
  readSave();


function saveProgress(){

  localStorage.setItem(
    "samhaehoe-progress",
    JSON.stringify(
      [...solved]
    )
  );

}


/* =========================
   TITLE
========================= */

titleScreen.addEventListener(
  "pointerup",
  function(event){

    if(
      event.target.closest(
        "button"
      )
    ){
      return;
    }


    if(titleOpened){
      return;
    }


    titleOpened = true;

    touchText.style.display =
      "none";

    titleMenu.classList.add(
      "show"
    );

  }
);


/* =========================
   OPEN MAP
========================= */

function openMap(
  loadSave
){

  titleScreen.style.display =
    "none";

  mapScreen.classList.add(
    "show"
  );


  if(!loadSave){

    solved =
      new Set();

    saveProgress();

  }


  renderProgress();

}


/* NEW GAME */

document
.getElementById("new-game")
.addEventListener(
  "click",
  function(event){

    event.stopPropagation();

    openMap(false);

  }
);


/* LOAD */

document
.getElementById("load-game")
.addEventListener(
  "click",
  function(event){

    event.stopPropagation();


    solved =
      readSave();


    if(
      solved.size === 0
    ){

      alert(
        "저장된 진행 기록이 없습니다."
      );

      return;

    }


    openMap(true);

  }
);


/* TITLE BACK */

document
.getElementById("back-title")
.addEventListener(
  "click",
  function(){

    mapScreen.classList.remove(
      "show"
    );

    titleScreen.style.display =
      "block";

  }
);


/* RESET */

document
.getElementById("reset-progress")
.addEventListener(
  "click",
  function(){

    solved =
      new Set();

    saveProgress();

    renderProgress();

    statusBox.textContent =
      "처음부터 다시.";

  }
);


/* =========================
   OPTIONS
========================= */

document
.getElementById("open-options")
.addEventListener(
  "click",
  function(event){

    event.stopPropagation();

    optionsModal.classList.add(
      "show"
    );

  }
);


document
.getElementById("close-options")
.addEventListener(
  "click",
  function(){

    optionsModal.classList.remove(
      "show"
    );

  }
);


let soundOn = true;


document
.getElementById("sound-toggle")
.addEventListener(
  "click",
  function(event){

    soundOn =
      !soundOn;

    event.currentTarget.textContent =
      soundOn
      ? "ON"
      : "OFF";

  }
);


document
.getElementById("clear-save")
.addEventListener(
  "click",
  function(){

    solved =
      new Set();

    saveProgress();

    alert(
      "진행 기록을 초기화했습니다."
    );

  }
);


/* =========================
   RENDER SOLVED ITEMS
========================= */

function renderProgress(){

  document
  .querySelectorAll(
    ".map-item"
  )
  .forEach(
    element =>
      element.remove()
  );


  document
  .querySelectorAll(
    ".item"
  )
  .forEach(
    item => {

      const key =
        item.dataset.key;


      if(
        solved.has(key)
      ){

        item.classList.add(
          "done"
        );

        placeOnMap(
          item
        );

      }

      else{

        item.classList.remove(
          "done"
        );

      }

    }
  );

}


/* =========================
   PLACE ITEM ON MAP
========================= */

function placeOnMap(
  item
){

  const target =
    document.getElementById(
      item.dataset.target
    );


  const mapRect =
    mapWrap.getBoundingClientRect();


  const targetRect =
    target.getBoundingClientRect();


  const x =
    (
      targetRect.left
      + targetRect.width / 2
      - mapRect.left
    )
    / mapRect.width
    * 100;


  const y =
    (
      targetRect.top
      + targetRect.height / 2
      - mapRect.top
    )
    / mapRect.height
    * 100;


  const image =
    document.createElement(
      "img"
    );


  image.className =
    "map-item";


  image.src =
    item.dataset.src;


  image.alt =
    "";


  image.style.left =
    x + "%";


  image.style.top =
    y + "%";


  mapWrap.appendChild(
    image
  );

}



function openCharacterPage(key){
  if(key === "busan"){
    setTimeout(function(){
      window.location.href = "minsu.html";
    }, 450);
  }
}


/* =========================
   DRAG ITEMS
========================= */

document
.querySelectorAll(
  ".item"
)
.forEach(
  item => {

    let dragging =
      false;

    let ghost =
      null;


    item.addEventListener(
      "pointerdown",
      function(event){

        if(
          item.classList.contains(
            "done"
          )
        ){
          return;
        }


        dragging =
          true;


        item.setPointerCapture(
          event.pointerId
        );


        mapWrap.classList.add(
          "dragging"
        );


        ghost =
          document.createElement(
            "div"
          );


        ghost.className =
          "drag-ghost";


        ghost.innerHTML =
          `<img src="${item.dataset.src}" alt="">`;


        document.body.appendChild(
          ghost
        );


        moveGhost(
          event
        );

      }
    );


    item.addEventListener(
      "pointermove",
      function(event){

        if(
          !dragging
          || !ghost
        ){
          return;
        }


        moveGhost(
          event
        );

      }
    );


    item.addEventListener(
      "pointerup",
      function(event){

        if(
          !dragging
        ){
          return;
        }


        dragging =
          false;


        mapWrap.classList.remove(
          "dragging"
        );


        const target =
          document.getElementById(
            item.dataset.target
          );


        const targetRect =
          target.getBoundingClientRect();


        const targetX =
          targetRect.left
          + targetRect.width / 2;


        const targetY =
          targetRect.top
          + targetRect.height / 2;


        const distance =
          Math.hypot(
            event.clientX - targetX,
            event.clientY - targetY
          );


        const allowedDistance =
          Math.max(
            targetRect.width,
            targetRect.height
          )
          * 1.45;


        if(ghost){

          ghost.remove();

          ghost =
            null;

        }


        if(
          distance
          <= allowedDistance
        ){

          const key =
            item.dataset.key;


          solved.add(
            key
          );


          saveProgress();


          item.classList.add(
            "done"
          );


          placeOnMap(
            item
          );

          openCharacterPage(key);


          if(
            solved.size === 3
          ){

            statusBox.textContent =
              "세 개 전부 제자리. 그런데 대체, 이런 걸 흘리고 다니는 놈들이 누구지.";

          }

          else{

            statusBox.textContent =
              "찾았다.";

          }

        }

        else{

          statusBox.textContent =
            "이곳은 아닌 것 같다.";

        }

      }
    );


    item.addEventListener(
      "pointercancel",
      function(){

        dragging =
          false;


        mapWrap.classList.remove(
          "dragging"
        );


        if(ghost){

          ghost.remove();

          ghost =
            null;

        }

      }
    );


    function moveGhost(
      event
    ){

      ghost.style.left =
        event.clientX
        + "px";


      ghost.style.top =
        event.clientY
        + "px";

    }

  }
);

</script>

</body>
</html>
